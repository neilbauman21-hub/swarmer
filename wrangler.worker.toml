# Deploy as a Worker with static assets: npx wrangler deploy -c wrangler.worker.toml
name = "swarmer"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
routes = [{ pattern = "swarm.lein-enterprises.lol", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"

[ai]
binding = "AI"

[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "Room" },
  { name = "MATCHMAKER", class_name = "Matchmaker" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Matchmaker"]
